name: ci
on: [push, pull_request]
jobs:
  test-and-reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt && pip install -e .
      - run: pytest -q
      - run: python -m circadian_dpyd.pipeline --config config/params.yaml --out results_ci
      - run: diff results/summary.json results_ci/summary.json
